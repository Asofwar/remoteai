name: Verify Linux release artifact

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
      sha256:
        description: Expected SHA-256 of the uploaded AppImage
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify uploaded Linux AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install desktop verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libappindicator3-1 xdg-utils \
            squashfs-tools xvfb xauth dbus-x11 x11-utils strace

      - name: Download and verify the exact release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          gh release download "$TAG_NAME" --pattern '*.AppImage' --dir "$RUNNER_TEMP/appimage"
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re

          expected = os.environ['EXPECTED_SHA256'].lower()
          if not re.fullmatch(r'[0-9a-f]{64}', expected):
              raise SystemExit('Expected a SHA-256 digest')
          assets = list((Path(os.environ['RUNNER_TEMP']) / 'appimage').glob('*.AppImage'))
          if len(assets) != 1:
              raise SystemExit('Expected exactly one AppImage')
          asset = assets[0]
          actual = hashlib.sha256(asset.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit('Release artifact checksum mismatch')
          asset.chmod(0o755)
          print(f'Verified {asset.name}: sha256:{actual}')
          PY

      - name: Verify permissions and visible startup
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verification"
          appimage=("$RUNNER_TEMP"/appimage/*.AppImage)
          log="$RUNNER_TEMP/verification/startup.log"
          if python3 scripts/verify-linux-appimage.py "${appimage[0]}" > "$log" 2>&1; then
            cat "$log"
          else
            cat "$log"
            # Capture a separate diagnostic run without changing the failed result.
            strace -f -s 256 -o "$RUNNER_TEMP/verification/trace.log" \
              python3 scripts/verify-linux-appimage.py "${appimage[0]}" || true
            exit 1
          fi

      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-verification
          path: ${{ runner.temp }}/verification/
