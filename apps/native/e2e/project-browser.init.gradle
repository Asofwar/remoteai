// Exercise the native WebView without replacing the user's app or touching its account data.
gradle.afterProject { project ->
    if (project.path == ':app') {
        project.android.defaultConfig.applicationId = 'com.codexswitch.mobile.filebrowsertest'
        project.extensions.getByName('react').entryFile =
            new File(project.rootDir, '../e2e/ProjectBrowserFixture.tsx')
        project.android.applicationVariants.all { variant ->
            variant.outputs.all { outputFileName = 'project-browser-fixture.apk' }
        }
    }
}
