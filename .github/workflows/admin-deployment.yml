name: Admin and Web deployment configuration

on:
  push:
    paths:
      - 'apps/admin-go/**'
      - 'apps/web/compose*.yml'
      - 'scripts/deploy.mjs'
      - 'scripts/lib/web-deployment.mjs'
      - 'scripts/web-deployment.test.mjs'
      - 'package.json'
      - '.github/workflows/admin-deployment.yml'
  pull_request:
    paths:
      - 'apps/admin-go/**'
      - 'apps/web/compose*.yml'
      - 'scripts/deploy.mjs'
      - 'scripts/lib/web-deployment.mjs'
      - 'scripts/web-deployment.test.mjs'
      - 'package.json'
      - '.github/workflows/admin-deployment.yml'

permissions:
  contents: read

jobs:
  compose-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify relay configuration and deployment guards
        env:
          COMPOSE_CONFIG_TEST: '1'
        run: python3 -B -m unittest discover -s apps/admin-go/scripts -p 'test_deployment_*.py' -v

  web-compose-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify Web deployment configuration and health checks
        env:
          COMPOSE_CONFIG_TEST: '1'
        run: node --test scripts/web-deployment.test.mjs

  kong-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/admin-go/go.mod
          cache-dependency-path: apps/admin-go/go.sum
      - name: Verify Kong covers registered Go endpoints and authentication boundaries
        run: go -C apps/admin-go test ./internal/server -run TestKong -count=1
