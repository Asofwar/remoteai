// Install separately from the user's app; retain the production native modules and renderer.
gradle.afterProject { project ->
    if (project.path == ':app') {
        project.android.defaultConfig.applicationId = 'com.codexswitch.mobile.scrolltest'
        project.extensions.getByName('react').entryFile = new File(project.rootDir, '../e2e/ChatScrollFixture.tsx')
    }
}
