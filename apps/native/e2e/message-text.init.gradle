// Exercise the real message renderer without replacing the installed app or its data.
gradle.afterProject { project ->
    if (project.path == ':app') {
        project.android.defaultConfig.applicationId = 'com.codexswitch.mobile.messagetest'
        project.extensions.getByName('react').entryFile = new File(project.rootDir, '../e2e/MessageTextFixture.tsx')
        project.android.applicationVariants.all { variant ->
            variant.outputs.all { outputFileName = 'message-text-fixture.apk' }
        }
    }
}
