// Use a separate package to leave the installed app and account data intact.
gradle.afterProject { project ->
    if (project.path == ':app') {
        project.android.defaultConfig.applicationId = 'com.codexswitch.mobile.goaltest'
        project.extensions.getByName('react').entryFile = new File(project.rootDir, '../e2e/GoalFixture.tsx')
        project.android.applicationVariants.all { variant ->
            variant.outputs.all { outputFileName = 'goal-fixture.apk' }
        }
    }
}
