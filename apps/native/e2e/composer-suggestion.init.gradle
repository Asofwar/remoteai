// Keep the user's installed app and account data intact while exercising the native renderer.
gradle.afterProject { project ->
    if (project.path == ':app') {
        project.android.defaultConfig.applicationId = 'com.codexswitch.mobile.suggestiontest'
        project.extensions.getByName('react').entryFile =
            new File(project.rootDir, '../e2e/ComposerSuggestionFixture.tsx')
        project.android.applicationVariants.all { variant ->
            variant.outputs.all { outputFileName = 'composer-suggestion-fixture.apk' }
        }
    }
}
