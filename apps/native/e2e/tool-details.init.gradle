// Use the production sheet and renderers in a separate package on the connected phone.
gradle.afterProject { project ->
    if (project.path == ':app') {
        project.android.defaultConfig.applicationId = 'com.codexswitch.mobile.tooldetailstest'
        project.extensions.getByName('react').entryFile = new File(project.rootDir, '../e2e/ToolDetailsFixture.tsx')
        project.android.applicationVariants.all { variant ->
            variant.outputs.all { outputFileName = 'tool-details-fixture.apk' }
        }
    }
}
